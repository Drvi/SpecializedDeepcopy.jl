name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `pre` is the newest Julia version, including alphas, betas and release candidates. Without a
        # newer prerelease, it is the latest release.
        version: ["1.10", "1.11", "1.12", "1.13", "pre"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `default` is the architecture of the runner. Because arch is a matrix value, the 32-bit
        # entries below add jobs instead of changing the 64-bit ones.
        arch: [default]
        include:
          # 32-bit Julia, before and after the Memory-based arrays of Julia 1.11. From Julia 1.12,
          # the suite also links a trimmed program.
          - version: "1.10"
            os: ubuntu-latest
            arch: x86
          - version: "1.13"
            os: ubuntu-latest
            arch: x86
    steps:
      - uses: actions/checkout@v7
      # JuliaC links 32-bit programs with `gcc -m32`, which needs the 32-bit C runtime. gcc-multilib
      # also installs x32 libraries. The launcher of 32-bit Julia 1.13 and later takes libstdc++ only
      # from the x32 entries of the linker cache, and cannot load it. JULIA_PROBE_LIBSTDCXX=0 makes
      # Julia load the libstdc++ that it bundles.
      - if: matrix.arch == 'x86' && runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib
          echo "JULIA_PROBE_LIBSTDCXX=0" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false

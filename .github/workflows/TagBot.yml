name: TagBot
# Creates the git tag and the GitHub release of each version that General registers.
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    # TagBot runs in a container, which ubuntu-slim does not support.
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@ffef3282bcacf1055e4d621a5c010959dfbe59ff # v1.25.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # With this deploy key, TagBot can also tag a commit that changes workflow files.
          ssh: ${{ secrets.COMPATHELPER_PRIV }}

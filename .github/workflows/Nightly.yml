name: Nightly
# Julia nightly changes every day, so test against it daily. Unlike the nightly jobs of CI.yml, which
# run only for changes to this repository and are advisory, a failure here fails the run.
on:
  schedule:
    # 03:23 UTC: GitHub can delay or drop scheduled runs at the start of an hour, when its load peaks.
    - cron: '23 3 * * *'
  workflow_dispatch:
jobs:
  test:
    name: Julia nightly on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: nightly
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false

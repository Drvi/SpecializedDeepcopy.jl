name: Nightly
# A new Julia prerelease can appear on any day, and CI.yml tests `pre` only for changes to this
# repository, so test the newest prerelease daily.
on:
  schedule:
    # 03:23 UTC: GitHub can delay or drop scheduled runs at the start of an hour, when its load peaks.
    - cron: '23 3 * * *'
  workflow_dispatch:
jobs:
  test:
    name: Julia ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["pre"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
